<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Fake News Detector</h1>

  <button id="toggleTextSelector">Text Selector: OFF</button>
  <p id="toggleStatus">Text Selector is OFF</p>

  <p>Enter text to check for authenticity:</p>
  <textarea id="input" placeholder="Paste news text here..."></textarea>

  <button id="check">Check News</button>

  <div id="output"></div>

  <script src="popup2.js"></script>
</body>
</html>
